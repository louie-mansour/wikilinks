name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod

      - name: Go tests
        run: cd service && go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: TypeScript check
        run: cd web && npx tsc --noEmit

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod

      - name: Build Go binary
        run: cd service && GOOS=linux GOARCH=amd64 go build -o ../bin/wikilinks-server ./cmd/server

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/wikihop_deploy
          chmod 600 ~/.ssh/wikihop_deploy
          ssh-keyscan -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy binary
        run: |
          rsync -az -e "ssh -i ~/.ssh/wikihop_deploy" \
            bin/wikilinks-server \
            deploy@${{ secrets.VPS_IP }}:/opt/wikihop/bin/wikilinks-server

      - name: Deploy frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/wikihop_deploy" \
            web/dist/ \
            deploy@${{ secrets.VPS_IP }}:/opt/wikihop/dist/

      - name: Restart service
        run: |
          ssh -i ~/.ssh/wikihop_deploy deploy@${{ secrets.VPS_IP }} \
            'sudo systemctl restart wikihop'
