    <meta charset="UTF-8" />

    <title>WikiHop — Wikipedia Hop Finder</title>
    <meta name="description" content="Find the fewest hops between any two Wikipedia articles. The WikiRace solver that shows every possible route — enter two pages and discover how many hops connect them.">

    <script>
      (function () {
        var ids = ['warm', 'midnight'];
        var id = 'warm';
        try {
          var stored = localStorage.getItem('wikihop-theme');
          if (stored && ids.indexOf(stored) !== -1) id = stored;
        } catch (e) {}
        document.documentElement.dataset.theme = id;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
